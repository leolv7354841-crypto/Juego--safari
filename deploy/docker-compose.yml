# Servidor en línea + Caddy (HTTPS automático para wss://). Desde esta carpeta:
#   docker compose up -d --build
# Las variables salen de deploy/.env (copia de .env.example).
services:
  dz:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    restart: unless-stopped
    # al parar o actualizar, el servidor avisa a los jugadores antes de cerrar
    stop_grace_period: 15s
    expose:
      - "2567"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [dz]
    environment:
      DOMAIN: ${DOMAIN:?falta DOMAIN en deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
