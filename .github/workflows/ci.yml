# Comprobación de cada push y pull request: el sellado de versión está al día, el servidor
# compila (tsc) y pasan sus pruebas. Si algo falla, el commit sale en rojo en GitHub.
name: Comprobación

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Sellado de versión al día (npm run stamp antes del commit)
        run: |
          node tools/stamp.mjs
          git diff --exit-code -- js/version.js index.html || {
            echo "::error::Falta ejecutar 'npm run stamp' y hacer commit de js/version.js e index.html"
            exit 1
          }

      - name: Build de Vercel
        run: node tools/build.mjs

      - name: Dependencias del servidor
        run: npm ci --prefix server

      - name: Tipos del servidor
        run: npm run build --prefix server

      - name: Pruebas del servidor
        run: npm run server:test
