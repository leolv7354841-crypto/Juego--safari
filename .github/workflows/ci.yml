# Comprobación de cada push y pull request: Biome y las pruebas
# del núcleo pasan, Playwright (Chromium y WebKit) pasa, el servidor
# compila (tsc) y pasan sus pruebas. Si algo falla, el commit sale en rojo en GitHub.
name: Comprobación

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Dependencias del servidor
        run: npm ci --prefix server

      - name: Tipos del servidor
        run: npm run build --prefix server

      - name: Pruebas del servidor
        run: npm run server:test

  # Calidad del cliente: formato/reglas (Biome) y pruebas del núcleo (node:test).
  nucleo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Biome (formato y reglas)
        run: npm run lint
      - name: Tipos (checkJs)
        run: npm run typecheck
      - name: Pruebas del núcleo
        run: npm test

  # Navegador real: Chromium y WebKit (Safari), incluida una sala en línea contra el servidor local.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix server
      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Pruebas de extremo a extremo
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
