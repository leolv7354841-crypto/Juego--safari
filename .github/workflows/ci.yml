# Comprobación de cada push y pull request: Biome y las pruebas
# del núcleo pasan, Playwright (Chromium y WebKit) pasa, el servidor
# compila (tsc) y pasan sus pruebas. Si algo falla, el commit sale en rojo en GitHub.
name: Comprobación

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Dependencias del servidor
        run: npm ci --prefix server

      - name: Tipos del servidor
        run: npm run build --prefix server

      - name: Pruebas del servidor
        run: npm run server:test

  # Calidad del cliente: formato/reglas (Biome) y pruebas del núcleo (node:test).
  nucleo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Biome (formato y reglas)
        run: npm run lint
      - name: Tipos (checkJs)
        run: npm run typecheck
      - name: Pruebas del núcleo
        run: npm test

  # Navegador real: Chromium y WebKit (Safari), incluida una sala en línea contra el servidor local.
  # Corre en la imagen oficial de Playwright, que ya trae los navegadores y sus bibliotecas del
  # sistema: instalarlas con apt en el runner tardaba de 30 s a más de 20 min según el espejo.
  # La etiqueta de la imagen debe ser la misma versión que @playwright/test en package.json.
  # Node 24 se instala aparte porque el servidor ejecuta .ts directamente (Node 22.18 o más nuevo).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix server
      - name: Pruebas de extremo a extremo
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
